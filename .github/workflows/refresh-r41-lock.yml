name: Refresh R 4.1 profile lock

on:
  workflow_dispatch:
  push:
    branches:
      - feature/env
    paths:
      - ".github/workflows/refresh-r41-lock.yml"

jobs:
  build-lock:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.1.3"
          use-public-rspm: false

      - name: Build the R 4.1 lock from its frozen binary snapshot
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "renv/profiles/r-4.1/renv.lock" -Force
          @'
          Sys.setenv(RENV_PROFILE = "r-4.1")
          source("renv/activate.R")
          options(
            repos = c(CRAN = "https://packagemanager.posit.co/cran/2023-06-15"),
            pkgType = "win.binary"
          )
          source("src/bootstrap/package_manifest.R", local = environment())
          renv::install(DRB_REQUIRED_PACKAGES, prompt = FALSE)
          renv::snapshot(type = "all", prompt = FALSE)
          renv::snapshot(packages = DRB_REQUIRED_PACKAGES, prompt = FALSE)
          '@ | Rscript --vanilla -

      - uses: actions/upload-artifact@v4
        with:
          name: r-4.1-lock
          path: renv/profiles/r-4.1/renv.lock
          if-no-files-found: error
