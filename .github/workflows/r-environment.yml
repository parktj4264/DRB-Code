name: R environment compatibility

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
      - develop
    paths:
      - "**/*.R"
      - ".Rprofile"
      - ".github/workflows/r-environment.yml"

jobs:
  verify:
    name: R ${{ matrix.r-version }} (${{ matrix.environment }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - r-version: "4.1.3"
            environment: "DRB-R4.1"
            library_dir: "R-4.1"
          - r-version: "4.5.2"
            environment: "DRB-R4.5"
            library_dir: "R-4.5"

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: false

      - name: Verify first project run_gui.R and run.R bootstrap
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\drb-localappdata
          DRB_TEST_EXPECTED_ENVIRONMENT: ${{ matrix.environment }}
          DRB_TEST_EXPECTED_LIBRARY_DIR: ${{ matrix.library_dir }}
        run: Rscript --vanilla .github/scripts/test_drb_simple_environment.R first

      - name: Verify R syntax
        shell: pwsh
        run: |
          @'
          files <- c(
            "run.R", "run_gui.R", "main.R",
            list.files("src", "[.]R$", recursive = TRUE, full.names = TRUE)
          )
          invisible(lapply(files, parse))
          cat("R_SYNTAX_OK\n")
          '@ | Rscript --vanilla -

      - name: Verify a second project copy reuses the same library
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\drb-localappdata
          DRB_TEST_EXPECTED_ENVIRONMENT: ${{ matrix.environment }}
          DRB_TEST_EXPECTED_LIBRARY_DIR: ${{ matrix.library_dir }}
        run: |
          $copyRoot = Join-Path $env:RUNNER_TEMP ("drb-copy-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $copyRoot | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "*") -Destination $copyRoot -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE ".Rprofile") -Destination $copyRoot -Force
          Push-Location $copyRoot
          try {
            Rscript --vanilla .github/scripts/test_drb_simple_environment.R reuse
          } finally {
            Pop-Location
          }

      - name: Verify ordinary R session remains unchanged
        shell: pwsh
        env:
          LOCALAPPDATA: ${{ runner.temp }}\drb-localappdata
        run: |
          $testScript = Join-Path $env:GITHUB_WORKSPACE ".github/scripts/test_drb_environment_session_isolation.R"
          Push-Location $env:RUNNER_TEMP
          try {
            Rscript --vanilla $testScript
          } finally {
            Pop-Location
          }
